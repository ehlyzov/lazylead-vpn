minimumLimaVersion: 2.0.0

images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64

mounts: null

cpus: 2
memory: 2GiB
disk: 20GiB

vmType: vz

networks:
  - vzNAT: true

vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

containerd:
  user: false
  system: false
