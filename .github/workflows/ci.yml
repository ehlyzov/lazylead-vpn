name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - run: swift run LazyleadVPNCoreSelfTest
      - run: ./scripts/build_app_bundle.sh
      - run: ./scripts/build_installer_pkg.sh
      - name: Shell syntax
        run: |
          for script in scripts/*.sh ./*.sh packaging/scripts/postinstall; do
            bash -n "$script"
          done
  dns-and-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-domain-dns.txt
      - run: python scripts/test_domain_dns.py
      - run: python scripts/test_host_direct_routes.py
